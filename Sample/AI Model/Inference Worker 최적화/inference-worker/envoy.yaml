static_resources:

  # ────────────────────── listeners ──────────────────────
  listeners:
  - name: grpc_web_listener
    address:
      socket_address:
        address: 0.0.0.0        # Envoy 가 받을 IP (모든 인터페이스)
        port_value: 80        # Envoy 가 노출할 포트 (HTTP/1.1 gRPC-Web)

    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager

          stat_prefix: ingress_http
          codec_type: AUTO                    # HTTP/1.1 과 HTTP/2 모두 처리

          route_config:
            name: grpc_route
            virtual_hosts:
            - name: backend
              domains: ["*"]
              routes:
              - match: { prefix: "/" }        # 모든 경로를 gRPC 클러스터로
                route:
                  cluster: grpc_backend
                  max_grpc_timeout: 0s        # 클라이언트 timeout 헤더 그대로 사용

          http_filters:
            # ↓ 순서 중요! ① gRPC-Web 변환 → ② Router
            - name: envoy.filters.http.grpc_web
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
            - name: envoy.filters.http.router
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router


  # ─────────────────────── clusters ───────────────────────
  clusters:
  - name: grpc_backend
    connect_timeout: 0.5s
    type: LOGICAL_DNS            # 컨테이너 내부라 DNS → localhost
    dns_lookup_family: V4_ONLY

    http2_protocol_options: {}   # *** gRPC 는 HTTP/2 필수 ***

    load_assignment:
      cluster_name: grpc_backend
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1   # Python gRPC 서버가 바인딩된 주소
                port_value: 5001    # Python gRPC 서버 포트
