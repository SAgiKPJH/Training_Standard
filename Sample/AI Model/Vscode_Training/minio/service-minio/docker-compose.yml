version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: daq_minio_server
    network_mode: bridge
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web Console
    environment:
      MINIO_ROOT_USER: mirerosystem
      MINIO_ROOT_PASSWORD: mireroadmin
      MINIO_CACHE: "on"
      MINIO_CACHE_DRIVES: "/cache"
      MINIO_CACHE_EXPIRY: "15"         # 일 단위
      MINIO_CACHE_MAXUSE: "85"         # 퍼센트
    volumes:
      - /home/mirero/daq/volumes/default/:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  mc:
    image: minio/mc
    container_name: daq_minio_client
    network_mode: bridge
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 10;
        mc alias set local http://minio:9000 mirerosystem mireroadmin;
        mc mb --ignore-existing local/my-bucket;
        mc ls local;
        tail -f /dev/null
      "
    restart: unless-stopped
